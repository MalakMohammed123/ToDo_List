<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To_Do List</title>
    <link rel="stylesheet" href="project.css" />
  </head>

  <body>
    <div>
      <h1>To-Do List</h1>
      <p>Organize your tasks efficiently</p>
    </div>
    <div  class="input-but">
      <div class="input-text" >
        <input class="input" type="text" id="task" placeholder="what needs to be done?" />
    </div>
      <button type="button" id="btn">+Add</button>
    </div>
    <br />
    <div>
      <button class="btn" id="btnall">All (0)</button>
      <button class="btn" id="btnact">Active (0)</button>
      <button class="btn" id="btncomp">completed (0)</button>
    </div>
<div class="sec-message" >
    <section class="sec" id="message">
      <p class="message" id="message">No tasks yet. Add new one!</p>
    </section>
</div>
    <script src="project.js"></script>
  </body>
</html>
